schema_version: 1

context:
  name: juv
  version: "0.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/juv-${{ version }}.tar.gz
  sha256: 3d2b9b07b46afd850f0c3da61d59855dbb7e25698b34f37a10fcb26839adb12f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - juv = juv:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - click >=8.1.7
    - jupytext >=1.16.4
    - rich >=13.9.2
    - tomlkit >=0.13.2
    - whenever >=0.9.1
    - python-uv >=0.11.0
    # not listed but needed
    - python-tzdata

tests:
  - python:
      imports:
        - juv
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - juv --help

about:
  summary: A toolkit for reproducible Jupyter notebooks, powered by uv.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/manzt/juv

extra:
  recipe-maintainers:
    - thewchan
